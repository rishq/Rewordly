name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the ref is a version tag
        run: |
          case "${{ github.ref_name }}" in
            v[0-9]*) ;;
            *)
              echo "::error::Refusing to publish: '${{ github.ref_name }}' is not a version tag (expected something like v0.1.0)."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the signing secrets are present
        env:
          REWORDLY_KEYSTORE_BASE64: ${{ secrets.REWORDLY_KEYSTORE_BASE64 }}
          REWORDLY_KEYSTORE_PASSWORD: ${{ secrets.REWORDLY_KEYSTORE_PASSWORD }}
          REWORDLY_KEY_ALIAS: ${{ secrets.REWORDLY_KEY_ALIAS }}
          REWORDLY_KEY_PASSWORD: ${{ secrets.REWORDLY_KEY_PASSWORD }}
        run: |
          missing=""
          for name in REWORDLY_KEYSTORE_BASE64 REWORDLY_KEYSTORE_PASSWORD REWORDLY_KEY_ALIAS REWORDLY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See README.md, section CI/CD."
            exit 1
          fi

      - name: Decode the keystore
        env:
          REWORDLY_KEYSTORE_BASE64: ${{ secrets.REWORDLY_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$REWORDLY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Derive the version from the tag
        run: |
          tag="${{ github.ref_name }}"
          echo "REWORDLY_VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          echo "REWORDLY_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Run the checks
        run: ./gradlew ktlintCheck testDebugUnitTest

      - name: Build the release APK
        env:
          REWORDLY_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          REWORDLY_KEYSTORE_PASSWORD: ${{ secrets.REWORDLY_KEYSTORE_PASSWORD }}
          REWORDLY_KEY_ALIAS: ${{ secrets.REWORDLY_KEY_ALIAS }}
          REWORDLY_KEY_PASSWORD: ${{ secrets.REWORDLY_KEY_PASSWORD }}
          REWORDLY_API_BASE_URL: ${{ vars.REWORDLY_API_BASE_URL || 'https://api.rewordly.invalid/' }}
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner=$(ls -d "$sdk"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Stage the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/rewordly-${REWORDLY_VERSION_NAME}.apk"
          ls -l dist

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
          else
            gh release create "$tag" dist/*.apk --title "$tag" --generate-notes
          fi
