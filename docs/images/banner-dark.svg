<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-label="Rewordly — Learn English, one card at a time">
  <!-- Dark banner, brand style v2: launcher icon mark + wordmark + slogan, same geometry as rewordly-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="0.55" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#00D0B0"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A3DF0"/>
      <stop offset="1" stop-color="#2E8BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="480" fill="#0D0F24"/>
  <circle cx="268" cy="240" r="215" fill="url(#glow)"/>
  <!-- the launcher mark: 512-unit icon art at 0.58 -->
  <g transform="translate(120,92) scale(0.58)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect x="140" y="112" width="214" height="276" rx="38" fill="#fff" opacity="0.30" transform="rotate(14 247 250)"/>
    <rect x="140" y="122" width="214" height="276" rx="38" fill="#fff" transform="rotate(-8 247 260)"/>
    <g transform="rotate(-8 247 260)" fill="none" stroke="url(#rg)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
      <path d="M205 205 V325"/>
      <path d="M205 205 H255 a46 46 0 0 1 0 92 H205"/>
      <path d="M252 300 L298 340"/>
    </g>
    <path d="M338 104 Q338 138 372 138 Q338 138 338 172 Q338 138 304 138 Q338 138 338 104Z" fill="#FFC53D"/>
    <path d="M380 180 Q380 196 396 196 Q380 196 380 212 Q380 196 364 196 Q380 196 380 180Z" fill="#FFE08A"/>
    <circle cx="150" cy="420" r="9" fill="#fff" opacity="0.6"/>
  </g>
  <!-- right flourish: faint card stack -->
  <g opacity="0.6">
    <rect x="1214" y="64" width="168" height="168" rx="40" fill="#3A22A8" opacity="0.55"/>
    <rect x="1260" y="100" width="168" height="168" rx="40" fill="#2A3A9E" opacity="0.45"/>
    <rect x="1306" y="136" width="168" height="168" rx="40" fill="#9B7BFF" opacity="0.30"/>
  </g>
  <text x="470" y="215" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2"><tspan fill="url(#rg)">Re</tspan><tspan fill="#ECEEFF">wordly</tspan></text>
  <text x="474" y="268" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="1.5" fill="#9AA0C8">Learn English, one card at a time</text>
  <rect x="470" y="300" width="272" height="48" rx="24" fill="#151833" stroke="#4A4F7A"/>
  <text x="606" y="332" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#DDE3FF">Kotlin + Compose</text>
  <rect x="758" y="300" width="226" height="48" rx="24" fill="#151833" stroke="#4A4F7A"/>
  <text x="871" y="332" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#DDE3FF">Offline-first</text>
  <rect x="1000" y="300" width="350" height="48" rx="24" fill="#151833" stroke="#4A4F7A"/>
  <text x="1175" y="332" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#DDE3FF">Bring your own AI key</text>
  <text x="474" y="404" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#9AA0C8">Spaced repetition · swipe to answer · graduation after 5 recalls in a row</text>
</svg>
