org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend base URL used by the app. Override per machine in ~/.gradle/gradle.properties,
# via -PREWORDLY_API_BASE_URL=..., or the REWORDLY_API_BASE_URL environment variable.
# Provider API keys are never configured here: a key entered in the app is encrypted with the
# Android Keystore on the device (see README, "AI vocabulary generation").
REWORDLY_API_BASE_URL=https://api.rewordly.invalid/
